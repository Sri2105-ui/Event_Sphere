services:
  # =========================================================================
  # EventSphere Backend API & WebSocket Web Service (Render)
  # =========================================================================
  - type: web
    name: eventsphere-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set in Render Dashboard: your MongoDB connection string
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://event-sphere-blush-alpha.vercel.app
