services:
  # =========================================================================
  # 1. EventSphere Backend API & WebSocket Web Service
  # =========================================================================
  - type: web
    name: eventsphere-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure 256-bit secret
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # Set to your Frontend URL (e.g. https://eventsphere-frontend.onrender.com)

  # =========================================================================
  # 2. EventSphere Frontend React Static Site
  # =========================================================================
  - type: web
    name: eventsphere-frontend
    env: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your Backend URL + /api (e.g. https://eventsphere-backend.onrender.com/api)
